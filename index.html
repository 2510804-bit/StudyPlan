<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161d">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공부 기록">
<title>매일 공부 기록</title>
<style>
:root{color-scheme:dark;
--bg:oklch(.175 .012 255);--s1:oklch(.215 .013 255);--s2:oklch(.265 .014 255);--line:oklch(.31 .014 255);
--tx:oklch(.965 .006 255);--tx2:oklch(.73 .018 255);--tx3:oklch(.58 .02 255);
--ac:oklch(.83 .15 160);--ac2:oklch(.83 .15 160 / .14);--acink:oklch(.2 .05 160);--warn:oklch(.82 .13 75);
--ok:var(--ac);--sub:var(--tx2);--card:var(--s1);
--out:cubic-bezier(.23,1,.32,1);--drawer:cubic-bezier(.32,.72,0,1);--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 92px)}
h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.035em;margin:2px 0 18px;text-wrap:balance}
h2{font-size:13px;font-weight:600;color:var(--tx2);margin:28px 0 10px}
b{font-weight:650}
.sub{color:var(--tx2);font-size:13px}.warn{color:var(--warn);font-size:13px}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.card,.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.stats .stat{margin:0}
.stat b{display:block;white-space:nowrap;font-size:24px;font-weight:700;letter-spacing:-.04em;margin-top:2px;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s var(--out)}
:is(input,textarea,select,button):focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea{width:100%;min-height:84px;resize:vertical}
button{background:var(--ac);color:var(--acink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:transform .16s var(--out),filter .16s,opacity .16s}
button:active{transform:scale(.97)}button.g{background:var(--s2);color:var(--tx)}button:disabled{opacity:.5}
@media (hover:hover) and (pointer:fine){button:hover{filter:brightness(1.1)}.rec:hover,.tcard:hover{background:var(--s2)}}
.link{background:none;color:var(--ac);padding:0}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}.task.brk{opacity:.5}
.task .nm{font-weight:550}
.nm .u{background:linear-gradient(currentColor,currentColor) 0 calc(100% - 1px)/0 1.5px no-repeat;transition:background-size .28s var(--out),color .2s}
.task.on .nm .u{background-size:100% 1.5px;color:var(--tx2)}
.task .m{width:68px;text-align:right;padding:8px 10px}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--tx3);padding:0;display:grid;place-items:center;transition:background-color .18s var(--out),border-color .18s var(--out)}
.task input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid var(--acink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg) scale(.7);opacity:0;transition:opacity .15s,transform .2s var(--out)}
.task input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.task input[type=checkbox]:checked::after{opacity:1;transform:translateY(-1px) rotate(45deg) scale(1)}
.tcard,.rec{display:block;width:100%;text-align:left;background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;font-weight:400}
.rec{margin-bottom:10px}.rec .sub{display:inline}
.tic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--ac2);color:var(--ac);flex:none}
.tic svg,.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.goal{display:flex;align-items:center;gap:10px;margin:-8px 0 16px;font-size:14px;color:var(--tx2)}.goal b{color:var(--tx)}
.chip{font-size:12px;font-weight:650;color:var(--ac);background:var(--ac2);border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums}
.quote{margin:0 0 20px;color:var(--tx2);font-size:14px;text-wrap:pretty}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:9px;background:var(--bg);font-size:12px;display:grid;place-items:center;color:var(--tx3);font-variant-numeric:tabular-nums;transition:transform .16s var(--out)}
.cal div[data-go]:active{transform:scale(.94)}.cal .h{background:none;aspect-ratio:auto}.cal .t{box-shadow:inset 0 0 0 1.5px var(--ac);color:var(--tx)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--tx3);font-size:11px;font-weight:550;padding:8px 0}
.nav svg{width:22px;height:22px;transition:transform .2s var(--out)}.nav button.a{color:var(--ac)}.nav button:active svg{transform:scale(.9)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,8px);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:550;opacity:0;transition:opacity .2s var(--out),transform .2s var(--out);pointer-events:none}
.toast.s{opacity:1;transform:translate(-50%,0)}
.ban{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);max-width:536px;margin:0 auto;z-index:60;background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;transform:translateY(-160%);transition:transform .4s var(--drawer)}.ban.s{transform:none}
.tr{height:6px;background:var(--s2);border-radius:6px;overflow:hidden}.tr i{display:block;height:100%;border-radius:6px;background:var(--ac);transform-origin:left}
.tr.big{margin:0 0 20px}#sbar{transition:width .35s var(--out)}
.hb{margin-bottom:14px}.hb:last-child{margin:0}.hb .tr{margin-top:8px}
.ring{width:96px;height:96px;flex:none}.rb{fill:none;stroke:var(--s2);stroke-width:9}
.rf{fill:none;stroke:var(--ac);stroke-width:9;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);transform:rotate(-90deg);transform-origin:60px 60px}
.ring text{fill:var(--tx);font-size:24px;font-weight:700;letter-spacing:-.04em}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:20px}
.bc{flex:1;height:100%;position:relative;display:flex;align-items:flex-end}
.bc i{display:block;width:100%;min-height:3px;border-radius:4px 4px 2px 2px;background:var(--ac);opacity:.9;transform-origin:bottom}
.bc u{position:absolute;left:-4px;right:-4px;bottom:-18px;text-align:center;font-size:10px;color:var(--tx3);text-decoration:none}
@keyframes up{from{opacity:0;transform:translateY(8px)}}@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}@keyframes ring{from{stroke-dashoffset:var(--c)}}
.anim>*{animation:up .34s var(--out) both}
.anim>:nth-child(2){animation-delay:40ms}.anim>:nth-child(3){animation-delay:80ms}.anim>:nth-child(4){animation-delay:120ms}.anim>:nth-child(5){animation-delay:160ms}.anim>:nth-child(6){animation-delay:200ms}.anim>:nth-child(n+7){animation-delay:240ms}
.anim .bc i{animation:grow .6s var(--out) both}.anim .tr i{animation:growx .7s .1s var(--out) both}.anim .rf{animation:ring .9s .1s var(--out) both}
.tov{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:calc(env(safe-area-inset-top) + 16px) 24px calc(env(safe-area-inset-bottom) + 28px);background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .42s var(--drawer),visibility 0s .42s}
.tov.on{transform:none;visibility:visible;transition:transform .42s var(--drawer)}
.tx{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);background:none;color:var(--tx2);padding:10px 12px}
.tw{position:relative;width:min(78vw,300px);aspect-ratio:1}.tsvg{width:100%;height:100%}
.tk{fill:none;stroke:var(--s2);stroke-width:10}
.ta{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:150px 150px;transition:stroke-dashoffset 1s linear}
#tdot{transform-origin:150px 150px;transition:transform 1s linear}#tdot circle{fill:var(--tx)}
.tc{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center}
.tt{font-size:clamp(44px,14vw,60px);font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.ss{color:var(--ac)}.tov.fin .tt{color:var(--ac)}
.tov select{width:min(78vw,300px)}.tb{gap:12px}.tb button{min-width:130px}
.qq{max-width:300px;text-align:center;color:var(--tx3);font-size:13px;min-height:40px}
.qtx{transition:opacity .3s var(--out)}.qtx.o{opacity:0}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.bub{padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.55;max-width:90%;white-space:pre-wrap;animation:up .28s var(--out) both}
.bub.u{align-self:flex-end;background:var(--ac);color:var(--acink);border-bottom-right-radius:5px}
.bub.a{align-self:flex-start;background:var(--s2);border-bottom-left-radius:5px}
.pv{margin-top:8px;font-size:13px;color:var(--tx2);display:grid;gap:3px;font-variant-numeric:tabular-nums}
.dots{animation:blink 1s infinite alternate}@keyframes blink{to{opacity:.35}}
.pf{display:grid;gap:10px;padding:10px 0}.pf input[type=checkbox]{width:20px;height:20px;padding:0}
@media (prefers-reduced-motion:reduce){.anim>*,.anim .bc i,.anim .tr i,.anim .rf,.bub{animation-name:fade}.tov,.tov.on{transition-duration:.01s}}
.task>button.g{background:none;color:var(--tx2);padding:8px 10px;font-size:13px}
.row.card{padding:8px 10px}.row.card input[type=date]{flex:1;border:0;background:transparent;padding:8px 6px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<div class="tov" id="tov"></div><div class="ban" id="ban"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

/* ① Firebase 콘솔에서 복사한 설정값으로 교체하세요 */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};

/* ② 계획표: 수정은 여기서 (b:true = 휴식/식사, 체크 없음) */
const DEF_PLAN = [
  {g:"🌅 아침 공부",id:"m1",n:"수학Ⅱ 오답 2단원",t:"07:20–08:10 · 등교 전"},
  {g:"🌙 저녁 공부",id:"e1",n:"영어 단어",t:"17:00–17:25"},
  {id:"e2",n:"문학 2지문",t:"17:25–18:20"},
  {id:"b1",n:"휴식",t:"18:20–18:30",b:true},
  {id:"e3",n:"독서 2지문",t:"18:30–19:25"},
  {id:"b2",n:"저녁 식사",t:"19:25–19:55",b:true},
  {id:"e4",n:"미적분 쎈 A/B 한 단원",t:"19:55–22:55"},
  {id:"b3",n:"짧은 휴식",t:"22:55–23:05",b:true},
  {id:"e5",n:"현우진 수학Ⅱ 강의",t:"23:05–00:00"}
];
const tmin=t=>{const m=String(t).match(/(\d\d):(\d\d)/);return m?+m[1]*60+ +m[2]:0};
let PLAN=(()=>{try{const v=JSON.parse(localStorage.getItem("sp_plan")||"null");if(Array.isArray(v))return v}catch(e){}return DEF_PLAN.map(({g,...r})=>r)})();
let TASKS=[],SLOTS=[];
function rebuildPlan(){PLAN.sort((a,b)=>tmin(a.t)-tmin(b.t));TASKS=PLAN.filter(p=>!p.b);
  SLOTS=PLAN.map(p=>{const m=String(p.t).match(/(\d\d):(\d\d)\D+(\d\d):(\d\d)/);if(!m)return null;const a=+m[1]*60+ +m[2];let e=+m[3]*60+ +m[4];if(e<=a)e+=1440;return {...p,s:a,e}}).filter(Boolean)}
rebuildPlan();
const grp=t=>{const m=tmin(t);return m<360?"새벽":m<720?"오전":m<1080?"오후":"저녁"};
const cloudOn = !firebaseConfig.apiKey.startsWith("YOUR_");

const $ = s=>document.querySelector(s);
const pad = n=>String(n).padStart(2,"0");
const ds = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = ()=>ds(new Date());
const fmt = m=>{const t=Math.round((+m||0)*60),h=Math.floor(t/3600),mi=Math.floor(t/60)%60,x=t%60;return [h?h+"시간":"",(mi||(!h&&!x))?mi+"분":"",(x&&!h)?x+"초":""].filter(Boolean).join(" ")};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let all = JSON.parse(localStorage.getItem("sp_days")||"{}");   // {date:{d:{},m:{},memo}}
let user=null, db=null, auth=null, app=null, sync=cloudOn?"로그인 필요":"설정 안 됨";
let page="today", cur=today(), mon=today().slice(0,7), animNext=true;
let timer = JSON.parse(localStorage.getItem("sp_timer")||"null"); if(timer&&timer.start)timer={id:timer.id,date:timer.date,acc:0,since:timer.start};
let goal = JSON.parse(localStorage.getItem("sp_goal")||"{}");

const rec = d=>all[d]||(all[d]={d:{},m:{},memo:""});
const doneN = r=>r?TASKS.filter(t=>r.d[t.id]).length:0;
const minT = r=>r?TASKS.reduce((s,t)=>s+(+r.m[t.id]||0),0):0;
const active = r=>r&&(doneN(r)>0||minT(r)>0);

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("s");setTimeout(()=>e.classList.remove("s"),1400)}

/* ---------- 알림 · 명언 · 목표 · 타이머 ---------- */
const Q=["오늘 흘린 땀은 내일의 합격 문자가 돼요.","천 리 길도 한 걸음부터. 지금 이 10분이 시작이야.","시작이 반이다. 책상에 앉았으면 이미 절반은 한 거야.","어제의 나보다 딱 1%만 더 해 보자.","포기하고 싶을 때가 실력이 느는 순간이야.","완벽하지 않아도 괜찮아. 오늘도 해냈다는 게 중요해.","꾸준함은 재능을 이긴다.","지금 힘든 건 성장하고 있다는 신호야.","작은 습관이 큰 결과를 만들어.","계획은 지킬 때 비로소 힘이 생겨.","집중한 한 시간이 흐릿한 세 시간보다 낫다.","네가 쏟은 노력은 절대 배신하지 않아.","오늘 한 문제를 더 푸는 사람이 결국 이겨.","쉬는 것도 계획의 일부야. 쉬고 나면 더 멀리 가.","목표를 떠올려 봐. 그 자리에 서 있는 네 모습을.","한 번에 다 하려 하지 말고, 지금 이 단계만 해 보자.","틀린 문제는 실력이 올라갈 자리야.","마음이 흔들릴 땐 일단 5분만 해 보자.","합격은 하루하루 쌓은 기록의 합이야.","지치는 건 최선을 다하고 있다는 증거야.","오늘의 선택이 1년 뒤의 너를 만들어.","너는 생각보다 훨씬 잘하고 있어.","끝까지 가는 사람이 이기는 게 아니라, 계속 가는 사람이 이겨."];
let qIdx=Math.floor(Math.random()*Q.length), qAt=Date.now();
function nextQuote(){qIdx=(qIdx+1+Math.floor(Math.random()*(Q.length-1)))%Q.length;
  document.querySelectorAll(".qtx").forEach(e=>{e.classList.add("o");setTimeout(()=>{e.textContent=Q[qIdx];e.classList.remove("o")},350)})}
function quoteCard(){return `<p class="quote qtx">${Q[qIdx]}</p>`}

function goalCard(){
  if(!goal.u)return `<button class="goal link" data-a="setgoal">목표 대학 설정하기 →</button>`;
  const dd=goal.date?Math.round((new Date(goal.date+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5):null;
  return `<div class="goal"><span>목표</span><b>${esc(goal.u)}${goal.dept?" · "+esc(goal.dept):""}</b>${dd!==null?`<span class="chip">${dd>0?"D-"+dd:dd===0?"D-DAY":"D+"+(-dd)}</span>`:""}</div>`}
function goalForm(){return `<div class="card"><b>목표 대학</b><div style="display:grid;gap:8px;margin-top:10px"><input id="gu" placeholder="목표 대학 (예: 서울대학교)" value="${esc(goal.u||"")}"><input id="gd" placeholder="학과 (선택)" value="${esc(goal.dept||"")}"><div class="sub">시험 날짜 (선택 · D-day로 표시돼요)</div><input type="date" id="gdate" value="${goal.date||""}"><button data-a="savegoal">목표 저장</button></div></div>`}
function saveGoal(){localStorage.setItem("sp_goal",JSON.stringify(goal));if(user&&db)setDoc(doc(db,"users",user.uid,"settings","goal"),{...goal,updatedAt:Date.now()}).catch(()=>{})}


function alertList(){const o=[];SLOTS.forEach(x=>{
  if(!x.b)o.push({key:x.id+"s",at:x.s-10,t:`10분 뒤 시작: ${x.n}`,b:`${x.t.split(" ")[0]} 준비하고 자리에 앉자`});
  if(x.e-x.s>=20)o.push({key:x.id+"e",at:x.e-10,t:`10분 뒤 종료: ${x.n}`,b:"남은 10분 마무리하고 정리해 보자"})});return o}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.08;o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}
function notify(t,b){const n=$("#ban");n.innerHTML=`<b>${esc(t)}</b><div class="sub">${esc(b)}</div>`;n.classList.add("s");
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove("s"),9000);
  if("Notification" in window&&Notification.permission==="granted")try{new Notification(t,{body:b})}catch(e){}}
$("#ban").addEventListener("click",()=>$("#ban").classList.remove("s"));
function checkAlerts(){if(localStorage.getItem("sp_alert")==="0")return;
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();let f=JSON.parse(localStorage.getItem("sp_fired")||"{}");if(f.d!==today())f={d:today()};
  const hit=alertList().filter(a=>nm>=a.at&&nm<a.at+3&&!f[a.key]);
  if(hit.length){hit.forEach(a=>f[a.key]=1);notify(hit.map(a=>a.t).join(" · "),hit[0].b)}
  localStorage.setItem("sp_fired",JSON.stringify(f))}

}
function viewStats(){
  const s=monthStats(mon), first=new Date(s.y,s.mo-1,1).getDay();
  let cal=["일","월","화","수","목","금","토"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
  for(let i=1;i<=s.last;i++){const k=`${mon}-${pad(i)}`, r=all[k], p=doneN(r)/TASKS.length;
    const al=.2+p*.7,bg=active(r)?`background:oklch(.83 .15 160 / ${al.toFixed(2)});color:${al>.55?"var(--acink)":"var(--tx)"}`:"";
    cal+=`<div class="${k===today()?"t":""}" style="${bg}" data-go="${k}">${i}</div>`}
  return `<h1>월간 통계</h1>
  <div class="row card"><button class="g" data-a="pm">‹</button><b class="sp" style="text-align:center">${s.y}년 ${s.mo}월</b><button class="g" data-a="nm">›</button></div>
  <div class="stats">
      <div class="stat"><span class="sub">연속 공부 일수</span><b>${streak()}일</b><span class="sub">최장 ${bestStreak()}일</span></div>
   <div class="stat"><span class="sub">총 공부 시간</span><b>${fmt(s.min)}</b></div>
   <div class="stat"><span class="sub">공부한 날</span><b>${s.studied}일</b></div>
   <div class="stat"><span class="sub">하루 평균</span><b>${s.studied?fmt(Math.round(s.min/s.studied)):"0분"}</b></div></div>
  ${charts(mon,s)}<div class="card"><div class="cal">${cal}</div><div class="sub" style="margin-top:8px">진할수록 많이 완료한 날이에요. 날짜를 누르면 그날 기록으로 이동해요.</div></div>`;
}
function viewLog(){
  const ks=Object.keys(all).filter(k=>active(all[k])||all[k].memo).sort().reverse();
  return `<h1>공부 기록</h1>`+recent()+(ks.length?ks.map(k=>{const r=all[k];
    return `<button class="rec" data-go="${k}"><div class="row"><b>${k}</b><span class="sp"></span><span class="sub">${doneN(r)}/${TASKS.length} 완료 · ${fmt(minT(r))}</span></div>${r.memo?`<div class="sub" style="margin-top:4px">${esc(r.memo.slice(0,60))}</div>`:""}<div class="tr" style="margin-top:8px"><i style="width:${doneN(r)/TASKS.length*100}%"></i></div></button>`}).join("")
    :`<div class="card sub">아직 기록이 없어요. 오늘 탭에서 첫 기록을 남겨 보세요.</div>`);
}
function viewAcct(){
  return `<h1>계정</h1>`+goalForm()+alertCard()+`<div class="card">`+(!cloudOn
    ?`<b>클라우드 동기화 설정 전</b><p class="warn">index.html 위쪽 firebaseConfig를 채우면 구글 로그인과 동기화가 켜져요. 지금은 이 기기에만 저장돼요.</p>`
    :user?`<div class="row"><div class="sp"><b>${esc(user.displayName||"사용자")}</b><div class="sub">${esc(user.email||"")}</div></div><button class="g" data-a="logout">로그아웃</button></div>`
    :`<b>구글 계정으로 로그인</b><p class="sub">로그인하면 아이폰·아이패드에서 같은 기록을 볼 수 있어요.</p><button data-a="login" style="width:100%">Google로 로그인</button>`)
  +`</div><div class="card"><div class="sub">동기화 상태</div><b>${sync}</b></div>
  <p class="sub">기록은 기기에도 저장돼서 오프라인에서도 쓸 수 있고, 로그인 상태에선 자동으로 클라우드에 올라가요.</p>`;
}

function render(){
  const v={today:viewToday,stats:viewStats,log:viewLog,acct:viewAcct,plan:viewPlan}[page]();
  const ap=$("#app");ap.className=animNext?"anim":"";animNext=false;ap.innerHTML=v;
  $("#nav").innerHTML=[["today","오늘"],["stats","통계"],["log","기록"],["plan","계획"],["acct","계정"]].map(([k,n])=>`<button class="${page===k?"a":""}" data-p="${k}" aria-label="${n}">${ic(IC[k])}${n}</button>`).join("");
  tick();
}
function tick(){const m=$("#tmini");if(m&&timer){const x=Math.floor(el()/1000);m.textContent=pad(Math.floor(x/60))+":"+pad(x%60)}
  tickT();if(Date.now()-qAt>15000){qAt=Date.now();nextQuote()}}
setInterval(tick,1000);setInterval(checkAlerts,15000);

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-p],[data-a],[data-go]"); if(!t)return;
  if(t.dataset.p){page=t.dataset.p;animNext=true;render();scrollTo(0,0);return}
  if(t.dataset.go){cur=t.dataset.go;page="today";animNext=true;render();scrollTo(0,0);return}
  const a=t.dataset.a;
  if(a==="goToday"){cur=today();render()}
  if(a==="login")login();
  if(a==="logout")signOut(auth);
  if(a==="pm"||a==="nm"){const [y,m]=mon.split("-").map(Number),d=new Date(y,m-1+(a==="nm"?1:-1),1);mon=ds(d).slice(0,7);animNext=true;render()}
  if(a==="reset"&&confirm(cur+" 기록을 초기화할까요?")){all[cur]={d:{},m:{},memo:""};save(cur);render()}
  if(a==="padd"){editId="new";render()}
  if(a==="pedit"){editId=t.dataset.id;render()}
  if(a==="pcancel"){editId=null;render()}
  if(a==="pdel"&&confirm("이 계획을 삭제할까요?")){PLAN=PLAN.filter(x=>x.id!==t.dataset.id);savePlan();render()}
  if(a==="preset"&&confirm("기본 계획표로 되돌릴까요?")){PLAN=DEF_PLAN.map(({g,...r})=>({...r}));savePlan();render()}
  if(a==="psave"){const n=$("#pn").value.trim(),s1=$("#ps").value,e1=$("#pe").value;
    if(!n||!s1||!e1){toast("이름과 시간을 모두 입력해 줘");return}
    const it={id:t.dataset.id||"p"+Math.random().toString(36).slice(2,8),n,t:`${s1}–${e1}`,b:$("#pb").checked};
    const i=PLAN.findIndex(x=>x.id===it.id);if(i>=0)PLAN[i]=it;else PLAN.push(it);editId=null;savePlan();render();toast("저장했어!")}
  if(a==="aisend"){const inp=$("#aiin"),text=inp?inp.value.trim():"";if(!text||aiBusy)return;
    chat.push({r:"u",t:text});aiBusy=true;render();
    askAI().then(r=>chat.push({r:"a",t:r.reply||"계획을 짜 봤어요.",items:cleanItems(r.items)})).catch(e=>chat.push({r:"a",t:aiErr(e)}))
      .finally(()=>{aiBusy=false;render();const c=$(".chat");if(c)c.scrollTop=c.scrollHeight})}
  if(a==="aiapply"||a==="aiadd"){const m=chat[+t.dataset.id];if(!m||!m.items)return;
    if(a==="aiapply"&&!confirm("지금 계획표를 AI가 짠 계획으로 바꿀까요?"))return;
    applyItems(m.items,a==="aiadd"?"add":"replace");toast("적용했어!");render()}
  if(a==="setgoal"){page="acct";animNext=true;render();scrollTo(0,0)}
  if(a==="savegoal"){goal={u:$("#gu").value.trim(),dept:$("#gd").value.trim(),date:$("#gdate").value};saveGoal();toast("목표를 저장했어!")}
  if(a==="atoggle"){localStorage.setItem("sp_alert",localStorage.getItem("sp_alert")==="0"?"1":"0");render()}
  if(a==="aperm"){if(!("Notification" in window))toast("이 브라우저는 알림을 지원하지 않아요");else Notification.requestPermission().then(r=>toast(r==="granted"?"알림을 허용했어!":"알림이 허용되지 않았어요"))}
  if(a==="atest")notify("10분 뒤 시작: 테스트","이렇게 알려 줄게요");
  if(a==="aics")downloadIcs();
  if(a==="topen"){const o=$("#tov");tOpen=true;o.classList.add("pop");setTimeout(()=>o.classList.remove("pop"),900);renderTimer()}
  if(a==="tclose"){tOpen=false;renderTimer();render()}
  if(a==="tgo"){if(!timer)timer={id:tSel,date:today(),acc:0,since:Date.now()};else timer.since=Date.now();tsave();renderTimer()}
  if(a==="tpause"&&timer&&timer.since){timer.acc+=Date.now()-timer.since;timer.since=null;tsave();renderTimer()}
  if(a==="tend"&&timer){
    const sec=Math.round(el()/1000),mins=Math.round(sec/60*100)/100,id=timer.id,d=timer.date;
    if(sec>=10){const r=rec(d);r.m[id]=Math.round(((+r.m[id]||0)+mins)*100)/100;save(d)}
    timer=null;tsave();tOpen=false;renderTimer();render();toast(sec>=10?`${fmt(mins)} 저장했어!`:"10초 미만은 저장하지 않았어")
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="dt"&&t.value){cur=t.value;render()}
  if(t.id==="tsel"){tSel=t.value;renderTimer()}
  if(t.dataset.c){rec(cur).d[t.dataset.c]=t.checked;save(cur);t.closest(".task").classList.toggle("on",t.checked);liveStats()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.m){const v=Math.max(0,parseInt(t.value)||0);rec(cur).m[t.dataset.m]=v;save(cur);
    liveStats()}
  if(t.id==="memo"){rec(cur).memo=t.value;save(cur)}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();checkAlerts();
</script>
</body>
</html>
