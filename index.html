<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공부 기록">
<title>매일 공부 기록</title>
<style>
:root{--bg:#101827;--card:#1a2436;--line:#2a3750;--tx:#eef2f8;--sub:#8d9bb5;--ac:#7cc4ff;--ok:#5fd6a0;--warn:#ffb86b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 84px);max-width:640px;margin:0 auto}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.sub{color:var(--sub);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;margin-top:4px}
button,input,textarea,select{font:inherit;color:var(--tx)}
input,textarea{background:#0f1726;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
button{background:var(--ac);color:#0a1424;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
button.g{background:#26344d;color:var(--tx)}
textarea{width:100%;min-height:80px}
.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok)}
.task .m{width:64px;text-align:right}
.task.brk{opacity:.5}.task.on .nm{color:var(--ok)}
.nm{font-weight:600}
.timer{text-align:center}.timer .t{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.timer select{width:100%;margin-bottom:10px;padding:10px;background:#0f1726;border:1px solid var(--line);border-radius:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:8px;background:#0f1726;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.cal .h{background:none;aspect-ratio:auto;padding:2px}
.cal .t{outline:2px solid var(--ac)}
.rec{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--line);margin-bottom:8px;font-weight:400}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c1320;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.nav button{flex:1;background:none;color:var(--sub);font-size:12px;font-weight:600;padding:8px 0}
.nav button.a{color:var(--ac)}.nav span{display:block;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#fff;color:#111;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.s{opacity:1}
.pg{display:none}.pg.a{display:block}
.warn{color:var(--warn);font-size:13px}
/* ---- 다듬기 ---- */
html{background:var(--bg)}
body{background:radial-gradient(520px 320px at 85% -40px,rgba(124,196,255,.16),transparent 70%),radial-gradient(480px 300px at -10% 18%,rgba(95,214,160,.10),transparent 70%);background-attachment:fixed;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(90deg,#fff,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.card,.stat{background:rgba(26,36,54,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
.stat b{font-size:28px;font-weight:800;letter-spacing:-.03em}
button{background:linear-gradient(135deg,var(--ac),#8fe3c4);transition:transform .15s}
button:active{transform:scale(.96)}button.g{background:#26344d}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:10px;border:2px solid #3a4a68;display:grid;place-content:center;transition:.2s;background:transparent}
.task input[type=checkbox]::after{content:"✓";color:#06231a;font-weight:800;font-size:16px;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.task input[type=checkbox]:checked{background:linear-gradient(135deg,var(--ok),var(--ac));border-color:transparent}
.task input[type=checkbox]:checked::after{transform:scale(1)}
.timer .t{font-size:46px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ok));-webkit-background-clip:text;background-clip:text;color:transparent}
.cal div{border-radius:10px;font-weight:600}
.nav{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:616px;margin:0 auto;border-radius:24px;border:1px solid var(--line);background:rgba(12,19,32,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.nav button{background:none;border-radius:18px;transition:.2s}
.nav button.a{background:rgba(124,196,255,.14)}
.nav button.a span{transform:translateY(-2px) scale(1.15)}
.nav span{transition:transform .25s}
.tr{height:8px;background:#0f1726;border-radius:8px;overflow:hidden}
.tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ok));transform-origin:left}
.tr.big{height:10px;margin:-2px 0 14px}
.hb{margin-bottom:12px}.hb .tr{margin-top:6px}
.ring{width:104px;height:104px;flex:none}
.rb{fill:none;stroke:#0f1726;stroke-width:10}
.rf{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);transform:rotate(-90deg);transform-origin:60px 60px}
.ring text{fill:#fff;font-size:26px;font-weight:800}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:18px}
.bc{flex:1;height:100%;position:relative;display:flex;align-items:flex-end}
.bc i{display:block;width:100%;min-height:3px;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--ac),var(--ok));transform-origin:bottom}
.bc u{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:9px;color:var(--sub);text-decoration:none}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.anim>*{animation:up .6s both cubic-bezier(.2,.8,.2,1)}
.anim>:nth-child(2){animation-delay:.06s}.anim>:nth-child(3){animation-delay:.12s}.anim>:nth-child(4){animation-delay:.18s}.anim>:nth-child(5){animation-delay:.24s}.anim>:nth-child(6){animation-delay:.3s}.anim>:nth-child(n+7){animation-delay:.36s}
.anim .bc i{animation:grow .9s both cubic-bezier(.2,.8,.2,1)}
.anim .tr i{animation:growx 1s .2s both cubic-bezier(.2,.8,.2,1)}
.anim .rf{animation:ring 1.3s .25s both cubic-bezier(.2,.8,.2,1)}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:18px;pointer-events:none;animation:fade .5s .8s forwards}
#splash span{font-size:52px;color:var(--ac);animation:pop 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-40deg)}}
@keyframes fade{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div class="toast" id="toast"></div>
<div id="splash"><span>✦</span>매일 공부 기록</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,setDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ① Firebase 콘솔에서 복사한 설정값으로 교체하세요 */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};

/* ② 계획표: 수정은 여기서 (b:true = 휴식/식사, 체크 없음) */
const PLAN = [
  {g:"🌅 아침 공부",id:"m1",n:"수학Ⅱ 오답 2단원",t:"07:20–08:10 · 등교 전"},
  {g:"🌙 저녁 공부",id:"e1",n:"영어 단어",t:"17:00–17:25"},
  {id:"e2",n:"문학 2지문",t:"17:25–18:20"},
  {id:"b1",n:"휴식",t:"18:20–18:30",b:true},
  {id:"e3",n:"독서 2지문",t:"18:30–19:25"},
  {id:"b2",n:"저녁 식사",t:"19:25–19:55",b:true},
  {id:"e4",n:"미적분 쎈 A/B 한 단원",t:"19:55–22:55"},
  {id:"b3",n:"짧은 휴식",t:"22:55–23:05",b:true},
  {id:"e5",n:"현우진 수학Ⅱ 강의",t:"23:05–00:00"}
];
const TASKS = PLAN.filter(p=>!p.b);
const cloudOn = !firebaseConfig.apiKey.startsWith("YOUR_");

const $ = s=>document.querySelector(s);
const pad = n=>String(n).padStart(2,"0");
const ds = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = ()=>ds(new Date());
const fmt = m=>m>=60?`${Math.floor(m/60)}시간${m%60?` ${m%60}분`:""}`:`${m}분`;
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let all = JSON.parse(localStorage.getItem("sp_days")||"{}");   // {date:{d:{},m:{},memo}}
let user=null, db=null, auth=null, sync=cloudOn?"로그인 필요":"설정 안 됨";
let page="today", cur=today(), mon=today().slice(0,7), animNext=true;
let timer = JSON.parse(localStorage.getItem("sp_timer")||"null"); // {id,start,date}

const rec = d=>all[d]||(all[d]={d:{},m:{},memo:""});
const doneN = r=>r?TASKS.filter(t=>r.d[t.id]).length:0;
const minT = r=>r?TASKS.reduce((s,t)=>s+(+r.m[t.id]||0),0):0;
const active = r=>r&&(doneN(r)>0||minT(r)>0);

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("s");setTimeout(()=>e.classList.remove("s"),1400)}

/* ---------- 저장 ---------- */
const timers={};
function save(d){
  localStorage.setItem("sp_days",JSON.stringify(all));
  if(!user||!db)return;
  clearTimeout(timers[d]);
  timers[d]=setTimeout(()=>{
    setDoc(doc(db,"users",user.uid,"days",d),{...all[d],updatedAt:Date.now()})
      .catch(e=>{sync="동기화 오류: "+e.code;render()});
  },500);
}

/* ---------- Firebase ---------- */
let unsub=null, firstSnap=true;
if(cloudOn){
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth,u=>{
    user=u; if(unsub){unsub();unsub=null}
    if(!u){sync="로그인 필요";render();return}
    sync="동기화 중…"; firstSnap=true;
    unsub=onSnapshot(collection(db,"users",u.uid,"days"),s=>{
      const cloud={};
      s.forEach(x=>cloud[x.id]=x.data());
      if(firstSnap){ // 이 기기에만 있는 기록은 클라우드로 업로드
        Object.keys(all).forEach(k=>{ if(!cloud[k]&&active(all[k])) setDoc(doc(db,"users",u.uid,"days",k),{...all[k],updatedAt:Date.now()}) });
        firstSnap=false;
      }
      Object.keys(cloud).forEach(k=>all[k]={d:cloud[k].d||{},m:cloud[k].m||{},memo:cloud[k].memo||""});
      localStorage.setItem("sp_days",JSON.stringify(all));
      sync=s.metadata.fromCache?"오프라인 (연결되면 자동 동기화)":"동기화됨 ✓";
      if(!document.activeElement||!["INPUT","TEXTAREA"].includes(document.activeElement.tagName))render();
    },e=>{sync="동기화 오류: "+e.code;render()});
  });
}
async function login(){
  const p=new GoogleAuthProvider();
  try{await signInWithPopup(auth,p)}
  catch(e){ if(e.code!=="auth/popup-closed-by-user") try{await signInWithRedirect(auth,p)}catch(x){toast("로그인 실패: "+x.code)} }
}

/* ---------- 통계 ---------- */
function streak(){
  const d=new Date(); if(!active(all[ds(d)]))d.setDate(d.getDate()-1);
  let n=0; while(active(all[ds(d)])){n++;d.setDate(d.getDate()-1)} return n;
}
function bestStreak(){
  const ks=Object.keys(all).filter(k=>active(all[k])).sort(); let b=0,c=0,p=null;
  ks.forEach(k=>{const t=new Date(k+"T00:00:00");
    c=(p&&(t-p)/864e5===1)?c+1:1; b=Math.max(b,c); p=t}); return b;
}
function monthStats(m){
  const [y,mo]=m.split("-").map(Number), last=new Date(y,mo,0).getDate(), t=today();
  let days=0,done=0,min=0,studied=0;
  for(let i=1;i<=last;i++){const k=`${m}-${pad(i)}`; if(k>t)break; days++;
    const r=all[k]; done+=doneN(r); min+=minT(r); if(active(r))studied++}
  return {y,mo,last,days,done,min,studied,rate:days?Math.round(done/(days*TASKS.length)*100):0};
}

/* ---------- 화면 ---------- */
function ring(p){const C=2*Math.PI*46;return `<svg class="ring" viewBox="0 0 120 120"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#5fd6a0"/></linearGradient></defs><circle cx="60" cy="60" r="46" class="rb"/><circle cx="60" cy="60" r="46" class="rf" style="--c:${C};--o:${C*(1-p/100)}"/><text x="60" y="68" text-anchor="middle">${p}%</text></svg>`}
function bars(a,l){const mx=Math.max(1,...a);return `<div class="bars">`+a.map((v,i)=>`<div class="bc"><i style="height:${v/mx*88+(v?0:0)}%;animation-delay:${i*22}ms"></i><u>${l[i]}</u></div>`).join("")+`</div>`}
function hbars(it){const mx=Math.max(1,...it.map(x=>x[1]));return it.map(([n,v],i)=>`<div class="hb"><div class="row"><span class="nm" style="font-size:14px">${esc(n)}</span><span class="sp"></span><span class="sub">${fmt(v)}</span></div><div class="tr"><i style="width:${v/mx*100}%;animation-delay:${.2+i*.08}s"></i></div></div>`).join("")}
function charts(m,s){const mins=[],lb=[],sub={};TASKS.forEach(t=>sub[t.id]=0);
  for(let i=1;i<=s.last;i++){const r=all[`${m}-${pad(i)}`];mins.push(minT(r));lb.push(i===1||i%5===0?i:"");if(r)TASKS.forEach(t=>sub[t.id]+=+r.m[t.id]||0)}
  return `<div class="card"><div class="row"><div class="sp"><b>계획 완료율</b><div class="sub" style="margin-top:4px">${s.done} / ${s.days*TASKS.length}개 완료</div></div>${ring(s.rate)}</div></div>
  <div class="card"><b>일별 공부 시간</b><div class="sub" style="margin:4px 0 14px">이번 달 합계 ${fmt(s.min)}</div>${bars(mins,lb)}</div>
  <div class="card"><b>과목별 공부 시간</b><div style="margin-top:12px">${hbars(TASKS.map(t=>[t.n,sub[t.id]]))}</div></div>`}
function recent(){const a=[],l=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(minT(all[ds(d)]));l.push(i%2?"":d.getDate())}
  return `<div class="card"><b>최근 14일</b><div class="sub" style="margin:4px 0 14px">합계 ${fmt(a.reduce((x,y)=>x+y,0))}</div>${bars(a,l)}</div>`}
function viewToday(){
  const r=rec(cur), isT=cur===today();
  let h=`<h1>오늘의 공부 기록 ✦</h1>
  <div class="row card"><input type="date" id="dt" value="${cur}"><span class="sp"></span><button class="g" data-a="goToday">오늘로</button></div>
  <div class="stats"><div class="stat"><span class="sub">완료</span><b>${doneN(r)} / ${TASKS.length}</b></div>
  <div class="stat"><span class="sub">총 공부 시간</span><b>${fmt(minT(r))}</b></div></div><div class="tr big"><i style="width:${doneN(r)/TASKS.length*100}%"></i></div>`;
  if(isT){
    const run=timer&&timer.date===cur;
    h+=`<div class="card timer"><div class="sub">공부 타이머</div><div class="t" id="tm">00:00</div>
    <select id="tsel" ${timer?"disabled":""}>${TASKS.map(t=>`<option value="${t.id}" ${timer&&timer.id===t.id?"selected":""}>${esc(t.n)}</option>`).join("")}</select>
    <button data-a="${timer?"tstop":"tstart"}" style="width:100%">${timer?"■ 정지하고 시간 저장":"▶ 공부 시작"}</button></div>`;
  }
  h+=`<div class="card">`;
  PLAN.forEach(p=>{
    if(p.g)h+=`${p.id!==PLAN[0].id?"</div><div class=card>":""}<div class="sub" style="margin-bottom:4px">${p.g}</div>`;
    h+= p.b ? `<div class="task brk"><div class="sp"><div class="nm">${p.n}</div><div class="sub">${p.t}</div></div></div>`
    : `<div class="task ${r.d[p.id]?"on":""}"><input type="checkbox" data-c="${p.id}" ${r.d[p.id]?"checked":""}>
       <div class="sp"><div class="nm">${esc(p.n)}</div><div class="sub">${p.t}</div></div>
       <input class="m" type="number" inputmode="numeric" min="0" placeholder="0" data-m="${p.id}" value="${r.m[p.id]||""}"><span class="sub">분</span></div>`;
  });
  h+=`</div><h2>📝 메모</h2><textarea id="memo" placeholder="오늘 공부 메모">${esc(r.memo||"")}</textarea>
  <div class="row" style="margin-top:10px"><span class="sub sp">변경하면 자동 저장돼요</span><button class="g" data-a="reset">이 날짜 초기화</button></div>`;
  return h;
}
function viewStats(){
  const s=monthStats(mon), first=new Date(s.y,s.mo-1,1).getDay();
  let cal=["일","월","화","수","목","금","토"].map(d=>`<div class="h">${d}</div>`).join("")+"<div></div>".repeat(first);
  for(let i=1;i<=s.last;i++){const k=`${mon}-${pad(i)}`, r=all[k], p=doneN(r)/TASKS.length;
    const bg=active(r)?`background:rgba(95,214,160,${(.18+p*.7).toFixed(2)});color:#fff`:"";
    cal+=`<div class="${k===today()?"t":""}" style="${bg}" data-go="${k}">${i}</div>`}
  return `<h1>월간 통계</h1>
  <div class="row card"><button class="g" data-a="pm">‹</button><b class="sp" style="text-align:center">${s.y}년 ${s.mo}월</b><button class="g" data-a="nm">›</button></div>
  <div class="stats">
   <div class="stat"><span class="sub">계획 완료율</span><b>${s.rate}%</b><span class="sub">${s.done} / ${s.days*TASKS.length}개</span></div>
   <div class="stat"><span class="sub">연속 공부 일수</span><b>${streak()}일</b><span class="sub">최장 ${bestStreak()}일</span></div>
   <div class="stat"><span class="sub">총 공부 시간</span><b>${fmt(s.min)}</b></div>
   <div class="stat"><span class="sub">공부한 날 · 일평균</span><b>${s.studied}일</b><span class="sub">${s.studied?fmt(Math.round(s.min/s.studied)):"0분"}</span></div></div>
  ${charts(mon,s)}<div class="card"><div class="cal">${cal}</div><div class="sub" style="margin-top:8px">진할수록 많이 완료한 날이에요. 날짜를 누르면 그날 기록으로 이동해요.</div></div>`;
}
function viewLog(){
  const ks=Object.keys(all).filter(k=>active(all[k])||all[k].memo).sort().reverse();
  return `<h1>공부 기록</h1>`+recent()+(ks.length?ks.map(k=>{const r=all[k];
    return `<button class="rec" data-go="${k}"><div class="row"><b>${k}</b><span class="sp"></span><span class="sub">${doneN(r)}/${TASKS.length} 완료 · ${fmt(minT(r))}</span></div>${r.memo?`<div class="sub" style="margin-top:4px">${esc(r.memo.slice(0,60))}</div>`:""}<div class="tr" style="margin-top:8px"><i style="width:${doneN(r)/TASKS.length*100}%"></i></div></button>`}).join("")
    :`<div class="card sub">아직 기록이 없어요. 오늘 탭에서 첫 기록을 남겨 보세요.</div>`);
}
function viewAcct(){
  return `<h1>계정</h1><div class="card">`+(!cloudOn
    ?`<b>클라우드 동기화 설정 전</b><p class="warn">index.html 위쪽 firebaseConfig를 채우면 구글 로그인과 동기화가 켜져요. 지금은 이 기기에만 저장돼요.</p>`
    :user?`<div class="row"><div class="sp"><b>${esc(user.displayName||"사용자")}</b><div class="sub">${esc(user.email||"")}</div></div><button class="g" data-a="logout">로그아웃</button></div>`
    :`<b>구글 계정으로 로그인</b><p class="sub">로그인하면 아이폰·아이패드에서 같은 기록을 볼 수 있어요.</p><button data-a="login" style="width:100%">Google로 로그인</button>`)
  +`</div><div class="card"><div class="sub">동기화 상태</div><b>${sync}</b></div>
  <p class="sub">기록은 기기에도 저장돼서 오프라인에서도 쓸 수 있고, 로그인 상태에선 자동으로 클라우드에 올라가요.</p>`;
}

function render(){
  const v={today:viewToday,stats:viewStats,log:viewLog,acct:viewAcct}[page]();
  const ap=$("#app");ap.className=animNext?"anim":"";animNext=false;ap.innerHTML=v;
  $("#nav").innerHTML=[["today","✏️","오늘 공부"],["stats","📊","월간 통계"],["log","📚","공부 기록"],["acct","👤","계정"]]
   .map(([k,i,n])=>`<button class="${page===k?"a":""}" data-p="${k}"><span>${i}</span>${n}</button>`).join("");
  tick();
}
function tick(){
  const e=$("#tm"); if(!e)return;
  const s=timer?Math.floor((Date.now()-timer.start)/1000):0;
  e.textContent=`${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`.replace(/^00:/,"");
}
setInterval(tick,1000);

/* ---------- 이벤트 ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-p],[data-a],[data-go]"); if(!t)return;
  if(t.dataset.p){page=t.dataset.p;animNext=true;render();scrollTo(0,0);return}
  if(t.dataset.go){cur=t.dataset.go;page="today";animNext=true;render();scrollTo(0,0);return}
  const a=t.dataset.a;
  if(a==="goToday"){cur=today();render()}
  if(a==="login")login();
  if(a==="logout")signOut(auth);
  if(a==="pm"||a==="nm"){const [y,m]=mon.split("-").map(Number),d=new Date(y,m-1+(a==="nm"?1:-1),1);mon=ds(d).slice(0,7);animNext=true;render()}
  if(a==="reset"&&confirm(cur+" 기록을 초기화할까요?")){all[cur]={d:{},m:{},memo:""};save(cur);render()}
  if(a==="tstart"){timer={id:$("#tsel").value,start:Date.now(),date:today()};localStorage.setItem("sp_timer",JSON.stringify(timer));render()}
  if(a==="tstop"&&timer){
    const mins=Math.max(1,Math.round((Date.now()-timer.start)/60000)), r=rec(timer.date);
    r.m[timer.id]=(+r.m[timer.id]||0)+mins; const d=timer.date;
    timer=null;localStorage.removeItem("sp_timer");save(d);render();toast(`${mins}분 저장했어!`)
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="dt"&&t.value){cur=t.value;render()}
  if(t.dataset.c){rec(cur).d[t.dataset.c]=t.checked;save(cur);render()}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.m){const v=Math.max(0,parseInt(t.value)||0);rec(cur).m[t.dataset.m]=v;save(cur);
    const st=document.querySelectorAll(".stat b");if(st[1])st[1].textContent=fmt(minT(all[cur]))}
  if(t.id==="memo"){rec(cur).memo=t.value;save(cur)}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();
</script>
</body>
</html>
